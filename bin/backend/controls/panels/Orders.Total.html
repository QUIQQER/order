<div class="quiqqer-order-totals-row">
    <div class="quiqqer-order-totals-context">
        <p class="quiqqer-order-totals-title">{{title}}</p>
        <div class="quiqqer-order-totals-meta">
            {{#currency}}<span class="quiqqer-order-totals-currency">{{currency}}</span>{{/currency}}
            <span>{{countLabel}}: {{count}}</span>
        </div>
    </div>
    <div class="quiqqer-order-totals-groups">
        {{#groups}}
        <section class="quiqqer-order-totals-group quiqqer-order-totals-group--{{type}}" aria-label="{{title}}">
            <p class="quiqqer-order-totals-title">{{title}}</p>
            <dl class="quiqqer-order-totals-breakdown">
                {{#metrics}}
                <div class="quiqqer-order-totals-metric quiqqer-order-totals-metric--{{type}}{{#gross}} quiqqer-order-totals-metric--gross{{/gross}}">
                    <dt>{{label}}</dt>
                    <dd>{{value}}</dd>
                </div>
                {{/metrics}}
            </dl>
        </section>
        {{/groups}}
    </div>
</div>
